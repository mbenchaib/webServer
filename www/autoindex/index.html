<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Index of / · webserv</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
</head>
<body>
  <!-- Showcase mockup of a styled directory listing.
       The live listing is generated by the C++ backend and is not restyled here. -->
  <header class="nav">
    <div class="container nav__inner">
      <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="" /><span>webserv</span></a>
      <nav class="nav__links" aria-label="Primary">
        <a href="../index.html">Home</a>
        <a class="btn btn--ghost" href="../index.html">← Back</a>
      </nav>
    </div>
  </header>

  <main class="container autoindex">
    <div class="autoindex__head glass reveal reveal-1">
      <span class="eyebrow">Directory listing</span>
      <h1>Index of /</h1>
    </div>

    <ul class="filelist glass reveal reveal-2">
      <li class="filerow filerow--head">
        <span class="name">Name</span>
        <span class="meta">Size</span>
        <span class="meta meta--date">Modified</span>
      </li>
      <li class="filerow">
        <span class="name"><span class="ic ic--dir">↩</span><a href="../index.html">../</a></span>
        <span class="meta">—</span>
        <span class="meta meta--date">—</span>
      </li>
      <li class="filerow">
        <span class="name"><span class="ic ic--dir">▸</span><a href="#">assets/</a></span>
        <span class="meta">—</span>
        <span class="meta meta--date">2026-06-27</span>
      </li>
      <li class="filerow">
        <span class="name"><span class="ic ic--dir">▸</span><a href="#">css/</a></span>
        <span class="meta">—</span>
        <span class="meta meta--date">2026-06-27</span>
      </li>
      <li class="filerow">
        <span class="name"><span class="ic">●</span><a href="../index.html">index.html</a></span>
        <span class="meta">8.2 KB</span>
        <span class="meta meta--date">2026-06-27</span>
      </li>
      <li class="filerow">
        <span class="name"><span class="ic">●</span><a href="#">style.css</a></span>
        <span class="meta">11.4 KB</span>
        <span class="meta meta--date">2026-06-27</span>
      </li>
      <li class="filerow">
        <span class="name"><span class="ic">●</span><a href="#">hello.txt</a></span>
        <span class="meta">24 B</span>
        <span class="meta meta--date">2026-06-27</span>
      </li>
    </ul>
  </main>
</body>
</html>
