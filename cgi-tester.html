<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Webserv CGI Tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #00ff9f;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center;
      color: #555;
      font-size: 0.8rem;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px;
    }

    .card h2 {
      font-size: 0.85rem;
      color: #00ff9f;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
      margin-top: 12px;
    }
    label:first-of-type { margin-top: 0; }

    input[type="text"], input[type="file"], textarea, select {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #00ff9f44;
    }
    textarea { resize: vertical; min-height: 80px; }

    .method-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-right: 6px;
    }
    .GET    { background: #003d20; color: #00ff9f; }
    .POST   { background: #1a1a00; color: #ffd700; }
    .DELETE { background: #2a0000; color: #ff4444; }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    button:active { opacity: 0.6; }

    .btn-get    { background: #00ff9f22; color: #00ff9f; border: 1px solid #00ff9f44; }
    .btn-post   { background: #ffd70022; color: #ffd700; border: 1px solid #ffd70044; }
    .btn-delete { background: #ff444422; color: #ff4444; border: 1px solid #ff444444; }
    .btn-upload { background: #7f7fff22; color: #aaaaff; border: 1px solid #7f7fff44; }

    /* Response panel */
    .response-panel {
      max-width: 1100px;
      margin: 20px auto 0;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px;
    }
    .response-panel h2 {
      font-size: 0.85rem;
      color: #aaaaff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-pill {
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 20px;
      background: #222;
      color: #888;
    }
    .status-pill.ok  { background: #003d20; color: #00ff9f; }
    .status-pill.err { background: #2a0000; color: #ff4444; }

    .response-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 0.75rem;
      color: #555;
    }
    .response-meta span { color: #888; }

    #responseBox {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 14px;
      font-size: 0.78rem;
      min-height: 120px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #c8c8c8;
      max-height: 340px;
      overflow-y: auto;
    }

    .spinner {
      display: none;
      width: 12px; height: 12px;
      border: 2px solid #333;
      border-top-color: #00ff9f;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: auto;
    }
    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .server-row {
      display: flex;
      gap: 10px;
      max-width: 1100px;
      margin: 0 auto 20px;
      align-items: center;
    }
    .server-row label { color: #555; font-size: 0.75rem; min-width: 80px; margin: 0; }
    .server-row input { flex: 1; }

    .tag { color: #00b8ff; }
    .val { color: #ffd700; }
    .err-color { color: #ff4444; }
  </style>
</head>
<body>

  <h1>⚡ WEBSERV CGI TESTER</h1>
  <p class="subtitle">sends requests to your local HTTP server</p>

  <!-- Server config -->
  <div class="server-row">
    <label>Server</label>
    <input type="text" id="serverBase" value="http://localhost:8080" placeholder="http://localhost:8080" />
  </div>

  <div class="grid">

    <!-- GET CGI -->
    <div class="card">
      <h2><span class="method-badge GET">GET</span> CGI Script</h2>
      <label>Script path (e.g. /cgi-bin/hello.py)</label>
      <input type="text" id="getPath" value="/cgi-bin/hello.py" />
      <label>Query string params (key=value&amp;...)</label>
      <input type="text" id="getQuery" placeholder="name=Alice&age=30" />
      <button class="btn-get" onclick="sendGet()">▶ SEND GET</button>
    </div>

    <!-- POST CGI -->
    <div class="card">
      <h2><span class="method-badge POST">POST</span> CGI Script</h2>
      <label>Script path</label>
      <input type="text" id="postPath" value="/cgi-bin/form.py" />
      <label>Content-Type</label>
      <select id="postContentType">
        <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
        <option value="application/json">application/json</option>
        <option value="text/plain">text/plain</option>
      </select>
      <label>Body</label>
      <textarea id="postBody" placeholder='name=Alice&message=hello&#10;or&#10;{"name":"Alice"}'></textarea>
      <button class="btn-post" onclick="sendPost()">▶ SEND POST</button>
    </div>

    <!-- DELETE -->
    <div class="card">
      <h2><span class="method-badge DELETE">DELETE</span> Resource</h2>
      <label>Resource path</label>
      <input type="text" id="deletePath" value="/uploads/test.txt" />
      <button class="btn-delete" onclick="sendDelete()">▶ SEND DELETE</button>
    </div>

    <!-- File Upload -->
    <div class="card">
      <h2><span class="method-badge POST">POST</span> File Upload</h2>
      <label>Upload endpoint</label>
      <input type="text" id="uploadPath" value="/upload" />
      <label>File</label>
      <input type="file" id="uploadFile" />
      <button class="btn-upload" onclick="sendUpload()">▶ UPLOAD FILE</button>
    </div>

  </div>

  <!-- Response -->
  <div class="response-panel">
    <h2>
      RESPONSE
      <span class="status-pill" id="statusPill">—</span>
      <div class="spinner" id="spinner"></div>
    </h2>
    <div class="response-meta">
      <div>Method: <span id="metaMethod">—</span></div>
      <div>URL: <span id="metaUrl">—</span></div>
      <div>Time: <span id="metaTime">—</span></div>
    </div>
    <pre id="responseBox">// Response will appear here...</pre>
  </div>

<script>
  function base() {
    return document.getElementById('serverBase').value.replace(/\/$/, '');
  }

  function setLoading(on) {
    document.getElementById('spinner').classList.toggle('active', on);
  }

  function showResponse(method, url, res, body, ms) {
    const pill = document.getElementById('statusPill');
    pill.textContent = res.status + ' ' + res.statusText;
    pill.className = 'status-pill ' + (res.ok ? 'ok' : 'err');

    document.getElementById('metaMethod').textContent = method;
    document.getElementById('metaUrl').textContent = url;
    document.getElementById('metaTime').textContent = ms + 'ms';

    // Pretty-print if JSON
    let display = body;
    try {
      const parsed = JSON.parse(body);
      display = JSON.stringify(parsed, null, 2);
    } catch(e) {}

    document.getElementById('responseBox').textContent = display || '(empty body)';
  }

  function showError(method, url, err) {
    const pill = document.getElementById('statusPill');
    pill.textContent = 'ERROR';
    pill.className = 'status-pill err';
    document.getElementById('metaMethod').textContent = method;
    document.getElementById('metaUrl').textContent = url;
    document.getElementById('metaTime').textContent = '—';
    document.getElementById('responseBox').textContent =
      'Connection failed: ' + err.message +
      '\n\nMake sure your webserv is running at ' + base();
  }

  async function doFetch(method, url, options) {
    setLoading(true);
    const t0 = Date.now();
    try {
      const res = await fetch(url, { method, ...options });
      const body = await res.text();
      showResponse(method, url, res, body, Date.now() - t0);
    } catch(e) {
      showError(method, url, e);
    } finally {
      setLoading(false);
    }
  }

  function sendGet() {
    const path = document.getElementById('getPath').value;
    const qs   = document.getElementById('getQuery').value;
    const url  = base() + path + (qs ? '?' + qs : '');
    doFetch('GET', url, {});
  }

  function sendPost() {
    const path = document.getElementById('postPath').value;
    const ct   = document.getElementById('postContentType').value;
    const body = document.getElementById('postBody').value;
    const url  = base() + path;
    doFetch('POST', url, {
      headers: { 'Content-Type': ct },
      body
    });
  }

  function sendDelete() {
    const path = document.getElementById('deletePath').value;
    const url  = base() + path;
    doFetch('DELETE', url, {});
  }

  function sendUpload() {
    const path = document.getElementById('uploadPath').value;
    const file = document.getElementById('uploadFile').files[0];
    const url  = base() + path;
    if (!file) {
      document.getElementById('responseBox').textContent = 'Please select a file first.';
      return;
    }
    const form = new FormData();
    form.append('file', file, file.name);
    doFetch('POST', url, { body: form });
  }
</script>

</body>
</html>
