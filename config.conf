server
{
    listen 8080;
    host example1.com;
    max_body_size 1M;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET POST;
        root ./www;
        index index.html;
        directory_listing off;
    }

    location /upload {
        methods POST DELETE;
        root ./www/uploads;
        upload_dir ./www/uploads;
    }

    location /old {
        redirect 301 /new;
    }

    location /cgi-bin
    {
        methods GET POST;
        root ./www/cgi-bin;
        cgi .py /usr/bin/python;
    }
}